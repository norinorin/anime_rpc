<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime RPC</title>

    <!-- TODO: vendor tailwind, alpinejs, and material symbols -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      const withOpacity = (varName) =>
        `color-mix(in srgb, var(${varName}) calc(<alpha-value> * 100%), transparent)`;

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: {
                base: "var(--bg-base)",
                card: "var(--bg-card)",
                elevated: "var(--bg-elevated)",
                item: "var(--bg-item)",
              },
              line: {
                DEFAULT: withOpacity("--border-default"),
                muted: "var(--border-muted)",
                tooltip: "var(--border-tooltip)",
              },
              brand: {
                blue: {
                  DEFAULT: withOpacity("--color-blue"),
                  hover: "var(--color-blue-hover)",
                  active: "var(--color-blue-active)",
                },
                anilist: "var(--color-anilist)",
                mal: "var(--color-mal)",
              },
              status: {
                success: "var(--color-success)",
                danger: "var(--color-danger)",
                warning: "var(--color-warning-bg)",
              },
              content: {
                muted: "var(--text-muted)",
                subtle: "var(--text-subtle)",
              },
            },
          },
        },
      };
    </script>
    <!-- TODO: strip unused symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <style>
      :root {
        --bg-base: #000000;
        --bg-card: #151515;
        --bg-elevated: #1a1a1a;
        --bg-item: #111111;

        --border-default: #2a2a2c;
        --border-muted: #666666;
        --border-tooltip: #333333;

        --color-blue: #3e91ff;
        --color-blue-hover: #60a5fa;
        --color-blue-active: #2563eb;
        --color-anilist: #0b1622;
        --color-mal: #2e51a2;

        --color-success: #10b981;
        --color-danger: #ef4444;
        --color-warning-bg: #47381c;

        --text-muted: #888888;
        --text-subtle: #666666;
      }

      .material-symbols-rounded {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes marquee-loop {
        0% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      .marquee-track {
        width: 100%;
      }

      .marquee-item {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      .marquee-duplicate {
        display: none !important;
      }

      .group:hover .marquee-track,
      .card-active .marquee-track,
      .marquee-track.marquee-auto {
        width: max-content;
        animation: marquee-loop 8s linear infinite;
      }

      .group:hover .marquee-item,
      .card-active .marquee-item,
      .marquee-track.marquee-auto .marquee-item {
        overflow: visible;
        text-overflow: clip;
        width: auto;
      }

      .group:hover .marquee-duplicate,
      .card-active .marquee-duplicate,
      .marquee-track.marquee-auto .marquee-duplicate {
        display: block !important;
      }

      .kbd-tooltip {
        pointer-events: none;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 150ms ease;
        padding: 0.125rem 0.375rem;
        font-size: 10px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background-color: var(--bg-elevated);
        color: var(--text-muted);
        border: 1px solid var(--border-tooltip);
        border-radius: 0.25rem;
        white-space: nowrap;
        z-index: 99;
      }

      .group:hover .kbd-tooltip,
      .group:focus-within .kbd-tooltip {
        opacity: 1;
      }
    </style>
  </head>
  <body
    class="h-full flex justify-center items-center bg-black font-sans antialiased select-none sm:p-4 md:p-6"
    x-data="animeRpcApp()"
    x-init="initApp()"
  >
    <div
      class="w-full h-full sm:w-[400px] sm:h-[800px] md:w-full md:max-w-6xl md:h-[85vh] md:min-h-[650px] bg-black flex flex-col relative overflow-hidden border border-line sm:rounded-[32px] shadow-2xl md:divide-x md:divide-line"
    >
      <div
        x-show="sseState !== 'connected' && search.results.length > 0 && (view === 'search' || isDesktop)"
        x-cloak
        class="w-full flex-none bg-status-warning text-amber-200 text-xs px-4 py-2 flex items-center justify-center gap-2 border-b border-line"
      >
        <span class="material-symbols-rounded text-base">warning</span>
        <span
          >Offline — showing cached
          <span
            x-text="search.provider === 'myanimelist' ? 'MyAnimeList' : 'AniList'"
          ></span>
          results</span
        >
      </div>

      <div
        class="flex-1 flex flex-col md:flex-row overflow-hidden md:divide-x md:divide-line"
      >
        <div
          x-show="view === 'config'"
          class="flex-1 md:!flex md:w-[380px] md:min-w-[350px] md:max-w-[400px] md:flex-none flex flex-col pt-8 md:pt-6 pb-5 px-0 h-full overflow-hidden min-w-0"
        >
          <div class="px-6 mb-2 flex items-center gap-2 text-xs">
            <span
              class="inline-block w-2.5 h-2.5 rounded-full"
              :class="{
                'bg-status-success': sseState === 'connected',
                'bg-gray-600': sseState === 'connecting',
                'bg-status-danger': sseState === 'disconnected'
              }"
            ></span>

            <template x-if="sseState === 'connecting'">
              <span class="text-content-muted">Connecting to daemon...</span>
            </template>
            <template x-if="sseState === 'connected'">
              <span class="text-content-muted">Daemon active</span>
            </template>
            <template x-if="sseState === 'disconnected'">
              <div class="flex items-center gap-2 text-status-danger">
                <span
                  >Daemon offline. Reconnecting in
                  <span x-text="reconnectSeconds"></span>s...</span
                >
                <button
                  @click="connectSse()"
                  class="font-bold underline text-white hover:text-gray-200"
                >
                  Connect now
                </button>
              </div>
            </template>
          </div>

          <div class="px-6 mb-4 flex items-center justify-between">
            <h1 class="text-3xl font-bold tracking-tight">Anime RPC</h1>

            <div class="flex items-center gap-1">
              <button
                @click="undoConfig()"
                :disabled="configHistory.length === 0"
                class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-line disabled:opacity-20 disabled:hover:bg-transparent disabled:hover:text-zinc-400 transition relative group"
                aria-label="Undo"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"
                  />
                </svg>
                <kbd
                  class="kbd-tooltip -bottom-8"
                  x-text="kbdText('Ctrl+Z')"
                ></kbd>
              </button>

              <button
                @click="redoConfig()"
                :disabled="configRedoHistory.length === 0"
                class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-line disabled:opacity-20 disabled:hover:bg-transparent disabled:hover:text-zinc-400 transition relative group"
                aria-label="Redo"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"
                  />
                </svg>
                <kbd
                  class="kbd-tooltip -bottom-8 -ml-4"
                  x-text="kbdText('Ctrl+Shift+Z')"
                ></kbd>
              </button>
            </div>
          </div>

          <div
            class="flex-1 mx-4 bg-surface-card rounded-3xl p-6 flex flex-col gap-4 overflow-y-auto no-scrollbar border border-line/50"
          >
            <div class="flex flex-col gap-2">
              <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-white">Poller</span>
                <button
                  @click="pollerDropdownOpen = !pollerDropdownOpen"
                  class="px-3 py-1.5 border border-content-subtle rounded-md text-xs text-content-muted hover:text-white flex items-center gap-2 transition-colors"
                >
                  <span
                    x-text="activePoller ? activePoller.display_name : 'Select...'"
                  ></span>
                  <span
                    class="text-[10px]"
                    x-text="pollerDropdownOpen ? '▲' : '▼'"
                  ></span>
                </button>
              </div>

              <div
                x-show="pollerDropdownOpen"
                x-transition
                class="flex flex-col gap-1 mt-2 bg-surface-elevated p-2 rounded-xl border border-line"
              >
                <template x-for="[id, p] in sortedPollers" :key="id">
                  <button
                    @click="selectPoller(id)"
                    :disabled="!p.active"
                    class="w-full text-left px-3 py-2 rounded-lg flex items-center justify-between text-xs transition-colors group"
                    :class="p.active ? 'hover:bg-brand-blue/20 text-white' : 'text-content-muted opacity-50 cursor-not-allowed'"
                  >
                    <div class="flex items-center gap-2">
                      <span
                        class="w-2 h-2 rounded-full"
                        :class="activePollerId === id ? 'bg-status-success' : 'bg-content-subtle'"
                      ></span>
                      <span class="font-medium" x-text="p.display_name"></span>
                    </div>
                    <div
                      class="overflow-hidden max-w-[180px]"
                      :title="p.filedir"
                      x-html="marqueeHtml(p.filedir ? 'Playing ' + cleanDirName(p.filedir) : '', { auto: activePollerId === id, classNames: 'text-[11px] text-content-muted', threshold: 32 })"
                    ></div>
                  </button>
                </template>
              </div>
            </div>

            <div class="h-[1px] bg-line"></div>

            <div class="flex flex-col gap-1">
              <label class="text-xs text-content-muted">Media title</label>
              <input
                type="text"
                x-ref="titleInput"
                x-model="config.title"
                :placeholder="titlePlaceholder || 'Title...'"
                class="bg-transparent border-b border-line focus:border-brand-blue text-sm py-1.5 outline-none transition-colors text-white placeholder-content-subtle"
              />
            </div>

            <div class="flex flex-col gap-1">
              <div class="flex items-center justify-start gap-1">
                <label class="text-xs text-content-muted leading-none"
                  >Media URL</label
                >
                <button
                  x-show="config.url"
                  @click="openUrl(config.url)"
                  class="text-content-muted hover:text-brand-blue inline-flex items-center justify-center"
                >
                  <span class="material-symbols-rounded text-sm block"
                    >open_in_new</span
                  >
                </button>
              </div>
              <div
                class="flex items-center gap-2 border-b border-line focus-within:border-brand-blue transition-colors"
              >
                <input
                  type="text"
                  x-model="config.url"
                  placeholder="URL..."
                  class="bg-transparent text-sm py-1.5 outline-none flex-1 text-white placeholder-content-subtle"
                />
                <button
                  @click="focusSearch()"
                  class="relative group text-content-muted hover:text-brand-blue p-1"
                >
                  <span class="material-symbols-rounded text-xl">search</span>
                  <kbd
                    class="kbd-tooltip -bottom-4"
                    x-text="kbdText('Ctrl+K')"
                  ></kbd>
                </button>
              </div>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-xs text-content-muted">Image URL</label>
              <input
                type="text"
                x-model="config.image_url"
                placeholder="URL..."
                class="bg-transparent border-b border-line focus:border-brand-blue text-sm py-1.5 outline-none transition-colors text-white placeholder-content-subtle"
              />
            </div>

            <div class="flex items-center justify-between py-1">
              <span class="text-sm">Rewatching</span>
              <button
                @click="config.rewatching = !config.rewatching"
                class="w-9 h-5 rounded-full p-0.5 transition-colors relative"
                :class="config.rewatching ? 'bg-brand-blue' : 'bg-content-subtle'"
              >
                <div
                  class="w-4 h-4 bg-white rounded-full transition-transform"
                  :class="config.rewatching ? 'translate-x-4' : 'translate-x-0'"
                ></div>
              </button>
            </div>

            <template x-if="config.image_url">
              <div
                class="flex flex-col items-center gap-2 pt-2 border-t border-line"
              >
                <span class="text-xs text-content-muted">Image preview</span>
                <img
                  :src="config.image_url"
                  @error="imageError = true"
                  x-show="!imageError"
                  class="max-w-[200px] h-auto rounded-lg border border-line object-contain max-h-[220px]"
                />
                <span x-show="imageError" class="text-xs text-content-subtle"
                  >Failed to load image</span
                >
              </div>
            </template>
          </div>

          <div class="p-4 px-6">
            <button
              @click="saveConfig()"
              class="relative group w-full py-2.5 rounded-lg text-sm font-semibold text-white transition-all duration-200"
              :class="{
                'bg-brand-blue hover:bg-brand-blue-hover active:bg-brand-blue-active': saveStatus === 'idle',
                'bg-status-success': saveStatus === 'saved',
                'bg-status-danger': saveStatus === 'failed'
              }"
            >
              <span
                x-text="saveStatus === 'idle' ? 'Save Changes' : (saveStatus === 'saved' ? '✔ Saved' : 'Failed to Save')"
              ></span>
              <kbd class="kbd-tooltip -top-8" x-text="kbdText('Ctrl+S')"></kbd>
            </button>
          </div>
        </div>

        <div
          x-show="view === 'search'"
          class="flex-1 md:!flex flex flex-col pt-8 md:pt-6 pb-5 px-0 h-full overflow-hidden min-w-0"
        >
          <div class="px-6 flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <button
                x-show="!isDesktop"
                @click="switchView('config')"
                class="text-white hover:text-content-muted p-1"
              >
                <span class="material-symbols-rounded text-2xl"
                  >arrow_back</span
                >
              </button>
              <h2 class="text-3xl font-bold">Search</h2>
            </div>

            <div class="flex items-center gap-2 text-xs">
              <span
                :class="search.provider === 'myanimelist' ? 'text-content-muted' : 'text-content-subtle'"
                >MAL</span
              >
              <button
                @click="toggleProvider()"
                class="w-9 h-5 rounded-full p-0.5 transition-colors relative"
                :class="search.provider === 'anilist' ? 'bg-brand-anilist' : 'bg-brand-mal'"
              >
                <div
                  class="w-4 h-4 bg-white rounded-full transition-transform"
                  :class="search.provider === 'anilist' ? 'translate-x-4' : 'translate-x-0'"
                ></div>
              </button>
              <span
                :class="search.provider === 'anilist' ? 'text-content-muted' : 'text-content-subtle'"
                >AniList</span
              >
            </div>
          </div>

          <div class="px-6 mb-4">
            <div
              class="flex items-center bg-surface-card rounded-xl px-3 py-1.5 border border-transparent focus-within:border-brand-blue"
            >
              <div class="flex items-center w-full">
                <input
                  type="text"
                  x-ref="searchInput"
                  x-model="search.query"
                  @input="search.hoveredIndex = null"
                  @keydown.enter="executeSearch()"
                  placeholder="Search title..."
                  class="bg-transparent text-sm py-1 outline-none flex-1 text-white placeholder-content-subtle"
                />
              </div>
              <button
                @click="executeSearch()"
                class="relative group text-white hover:text-content-muted p-1"
              >
                <span class="material-symbols-rounded text-xl">search</span>
                <kbd
                  class="kbd-tooltip -bottom-4"
                  x-text="kbdText('Ctrl+K')"
                ></kbd>
              </button>
            </div>
          </div>

          <div
            id="search_scroll"
            class="flex-1 mx-4 bg-surface-card rounded-3xl p-3 overflow-y-auto no-scrollbar border border-line/50"
          >
            <template x-if="search.results.length === 0">
              <div
                class="flex-1 flex items-center justify-center h-40 text-sm text-content-subtle"
              >
                <span
                  x-text="sseState === 'connected' ? 'No results on ' + (search.provider === 'myanimelist' ? 'MyAnimeList' : 'AniList') : 'Daemon is offline'"
                ></span>
              </div>
            </template>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              <template
                x-for="(res, index) in search.results"
                :key="res.id || index"
              >
                <div
                  @click="selectSearchResult(res)"
                  :id="'result-' + index"
                  class="p-3 rounded-2xl cursor-pointer flex gap-3 transition-colors duration-150 border border-transparent group"
                  :class="search.hoveredIndex === index ? 'bg-brand-blue text-white card-active' : 'hover:bg-surface-elevated bg-surface-item md:bg-transparent'"
                >
                  <img
                    :src="res.image_url"
                    class="w-12 h-18 bg-surface-card rounded-md object-cover flex-shrink-0"
                  />

                  <div
                    class="flex-1 flex flex-col justify-between overflow-hidden"
                  >
                    <div class="flex justify-between items-start gap-2">
                      <div
                        class="overflow-hidden w-full"
                        :title="res.title"
                        x-html="marqueeHtml(res.title, { classNames: 'text-sm font-bold leading-snug' })"
                      ></div>
                      <span
                        class="text-sm font-bold flex-shrink-0"
                        :class="search.hoveredIndex === index ? 'text-white' : 'text-status-success'"
                        :style="search.hoveredIndex === index ? '' : { color: getScoreColor(res.score) }"
                        x-text="res.score ? (res.score / 10).toFixed(2) + ' ★' : 'N/A'"
                      ></span>
                    </div>

                    <div class="flex items-center justify-between text-xs mt-1">
                      <div
                        class="flex items-center gap-2"
                        :class="search.hoveredIndex === index ? 'text-white' : 'text-content-muted'"
                      >
                        <span
                          x-show="res.media_format"
                          x-text="res.media_format ? res.media_format.toUpperCase() : ''"
                        ></span>
                        <span x-show="res.year" x-text="res.year"></span>
                        <span
                          x-show="res.status"
                          :class="getStatusColor(res.status, search.hoveredIndex === index)"
                          x-text="formatStatus(res.status)"
                        ></span>
                      </div>

                      <button
                        @click.stop="openUrl(res.url)"
                        class="p-1 hover:opacity-80"
                      >
                        <span class="material-symbols-rounded text-base"
                          >open_in_new</span
                        >
                      </button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function animeRpcApp() {
        return {
          view: "config", // 'config' | 'search'
          isDesktop: window.innerWidth >= 768,
          sseState: "connecting", // 'connecting' | 'connected' | 'disconnected'
          reconnectSeconds: 1,
          reconnectAttempt: 1,
          sseEventSource: null,

          pollerDropdownOpen: true,
          pollers: {},
          activePollerId: null,
          activeFiledir: null,
          titlePlaceholder: "",

          config: {
            title: "",
            url: "",
            image_url: "",
            rewatching: false,
          },
          configHistory: [],
          configRedoHistory: [],
          imageError: false,
          saveStatus: "idle", // 'idle' | 'saved' | 'failed'

          search: {
            query: "",
            provider: "myanimelist", // 'myanimelist' | 'anilist'
            results: [],
            hoveredIndex: null,
          },

          pushHistory() {
            this.configHistory.push(this.config ? { ...this.config } : {});
            if (this.configHistory.length > 20) this.configHistory.shift();
            this.configRedoHistory = [];
          },

          undoConfig() {
            if (this.configHistory.length > 0) {
              if (this.config) this.configRedoHistory.push({ ...this.config });
              this.config = this.configHistory.pop();
              this.search.query = this.config.title || this.titlePlaceholder;
            }
          },

          redoConfig() {
            if (this.configRedoHistory.length > 0) {
              if (this.config) this.configHistory.push({ ...this.config });
              this.config = this.configRedoHistory.pop();
              this.search.query = this.config.title || this.titlePlaceholder;
            }
          },

          getScoreColor(score) {
            if (!score) return "var(--text-subtle)";
            const percentage = Math.min(Math.max((score / 1000) * 100, 0), 100);
            return `color-mix(in srgb, var(--color-success) ${percentage}%, var(--color-danger))`;
          },

          initApp() {
            this.connectSse();
            this.bindKeyboardShortcuts();

            this.$watch("search.hoveredIndex", (idx) => {
              if (idx !== null) {
                this.$nextTick(() => {
                  document
                    .getElementById(`result-${idx}`)
                    ?.scrollIntoView({ block: "nearest" });
                });
              }
            });

            window.addEventListener("resize", () => {
              this.isDesktop = window.innerWidth >= 768;
            });

            this.$watch("config.image_url", () => {
              this.imageError = false;
            });
          },

          connectSse() {
            if (this.sseEventSource) this.sseEventSource.close();
            this.sseState = "connecting";

            this.sseEventSource = new EventSource("/pollers/events");

            this.sseEventSource.onopen = () => {
              this.sseState = "connected";
              this.reconnectAttempt = 1;
            };

            this.sseEventSource.onmessage = (e) => {
              try {
                const payload = JSON.parse(e.data);
                this.pollers = payload;

                if (
                  this.activePollerId &&
                  !this.pollers[this.activePollerId]?.active
                ) {
                  this.clearConfigForm();
                }

                if (!this.activePollerId) {
                  const activeEntry = Object.entries(this.pollers).find(
                    ([_, p]) => p.active,
                  );
                  if (activeEntry) {
                    this.selectPoller(activeEntry[0]);
                  }
                }
              } catch (err) {
                console.error("Failed to parse SSE payload:", err);
              }
            };

            this.sseEventSource.onerror = () => {
              this.sseState = "disconnected";
              this.sseEventSource.close();
              this.scheduleReconnect();
            };
          },

          scheduleReconnect() {
            const backoff = Math.min(Math.pow(2, this.reconnectAttempt), 60);
            this.reconnectSeconds = backoff;
            this.reconnectAttempt++;

            const timer = setInterval(() => {
              this.reconnectSeconds--;
              if (this.reconnectSeconds <= 0) {
                clearInterval(timer);
                this.connectSse();
              }
            }, 1000);
          },

          get sortedPollers() {
            return Object.entries(this.pollers).sort(
              (a, b) => (b[1].active ? 1 : 0) - (a[1].active ? 1 : 0),
            );
          },

          get activePoller() {
            return this.activePollerId
              ? this.pollers[this.activePollerId]
              : null;
          },

          selectPoller(id) {
            this.activePollerId = id;
            this.pollerDropdownOpen = false;
            const p = this.pollers[id];
            if (!p) return;

            if (this.activeFiledir !== p.filedir) {
              this.clearConfigForm();
              this.activeFiledir = p.filedir;
              this.titlePlaceholder = p.filedir
                ? this.cleanDirName(p.filedir)
                : "";
              this.search.query = this.titlePlaceholder;
            }

            if (p.active && p.filedir) {
              this.loadRpcConfig(p.filedir);
            }
          },

          async loadRpcConfig(filedir) {
            this.pushHistory();
            try {
              const res = await fetch(
                `/rpc?dir=${encodeURIComponent(filedir)}`,
              );
              if (!res.ok) return;
              this.config = await res.json();
              this.search.query = this.config.title || this.titlePlaceholder;
            } catch (e) {
              console.error("Failed to load RPC config:", e);
            }
          },

          async saveConfig() {
            if (!this.activePoller || !this.activePoller.filedir) return;

            try {
              const res = await fetch("/rpc", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  dir: this.activePoller.filedir,
                  title: this.config.title,
                  url: this.config.url,
                  image_url: this.config.image_url,
                  rewatching: this.config.rewatching,
                }),
              });

              this.saveStatus = res.ok ? "saved" : "failed";
            } catch (e) {
              this.saveStatus = "failed";
            }

            setTimeout(() => {
              this.saveStatus = "idle";
            }, 2000);
          },

          clearConfigForm() {
            this.config = {
              title: "",
              url: "",
              image_url: "",
              rewatching: false,
            };
            this.activeFiledir = null;
            this.titlePlaceholder = "";
          },

          async executeSearch() {
            this.search.hoveredIndex = null;

            if (!this.search.query) return;

            try {
              const res = await fetch(
                `/search?q=${encodeURIComponent(this.search.query)}&provider=${this.search.provider}`,
              );
              if (res.ok) {
                this.search.results = await res.json();
                this.search.hoveredIndex = null;
              }
            } catch (e) {
              console.error("Search failed:", e);
            }
          },

          formatStatus(status) {
            if (!status) return "";
            const s = status.toLowerCase();
            if (s === "tba") return "TBA";
            if (s === "releasing") return "Airing";
            return s.charAt(0).toUpperCase() + s.slice(1);
          },

          getStatusColor(status, isHovered) {
            if (isHovered) return "text-white";

            switch (status?.toLowerCase()) {
              case "tba":
                return "text-status-danger";
              case "releasing":
                return "text-brand-blue";
              default:
                return "text-status-success";
            }
          },

          selectSearchResult(result) {
            this.pushHistory();
            this.config.title = result.title;
            this.config.url = result.url;
            this.config.image_url = result.image_url;
            if (!this.isDesktop) {
              this.switchView("config");
            }
          },

          toggleProvider() {
            this.search.provider =
              this.search.provider === "myanimelist"
                ? "anilist"
                : "myanimelist";
            if (this.search.query) this.executeSearch();
          },

          focusSearch() {
            if (!this.search.query) {
              const currentTitle =
                this.$refs.titleInput?.value || this.config?.title;
              this.search.query =
                currentTitle ||
                (this.activeFiledir
                  ? this.cleanDirName(this.activeFiledir)
                  : "");
            }

            if (!this.isDesktop && this.view !== "search") {
              this.switchView("search");
            }

            this.$nextTick(() => {
              this.$refs.searchInput?.focus();
              this.$refs.searchInput?.select();
            });
          },

          switchView(targetView) {
            if (
              targetView === "search" &&
              this.activeFiledir &&
              !this.search.query
            ) {
              this.search.query = this.cleanDirName(this.activeFiledir);
            }
            this.view = targetView;

            if (targetView === "search") {
              this.$nextTick(() => {
                this.$refs.searchInput?.focus();
              });
            }
          },

          cleanDirName(path) {
            if (!path) return "";
            const base = path.split(/[/\\]/).pop() || "";
            return base
              .replace(/\[.*?\]|\(.*?\)/g, "")
              .replace(/\s+/g, " ")
              .trim();
          },

          openUrl(url) {
            if (url) window.open(url, "_blank");
          },

          escapeHtml(str) {
            return String(str)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          },

          marqueeHtml(text, options = {}) {
            const {
              auto = false,
              threshold = 22,
              classNames = "",
              fallback = "Waiting",
            } = options;

            const rawText = text || fallback;
            const safeText = this.escapeHtml(rawText);

            if (!text || rawText.length <= threshold) {
              return `<span class="${classNames} block truncate">${safeText}</span>`;
            }

            const autoClass = auto ? "marquee-auto" : "";
            return `
                    <div class="flex marquee-track ${autoClass}">
                      <span class="${classNames} pr-6 marquee-item block">${safeText}</span>
                      <span class="${classNames} pr-6 marquee-duplicate">${safeText}</span>
                    </div>
                  `;
          },

          isMac: (() => {
            if (typeof navigator === "undefined") return false;
            if (navigator.userAgentData?.platform) {
              return navigator.userAgentData.platform
                .toLowerCase()
                .includes("mac");
            }
            return /Mac|iPhone|iPad|iPod/i.test(
              navigator.userAgent || navigator.platform || "",
            );
          })(),

          kbdText(shortcut) {
            if (!this.isMac) return shortcut;
            return shortcut
              .replace(/Ctrl|Cmd/gi, "⌘")
              .replace(/Shift/gi, "⇧")
              .replace(/\+/g, "");
          },

          bindKeyboardShortcuts() {
            window.addEventListener("keydown", (e) => {
              const key = e.key.toLowerCase();
              const isCmdOrCtrl = e.metaKey || e.ctrlKey;
              const isInputFocused =
                document.activeElement === this.$refs.searchInput;
              const isEditingInput =
                document.activeElement?.tagName === "INPUT";

              if (
                (isCmdOrCtrl && (key === "k" || key === "l")) ||
                (e.key === "/" && !isEditingInput)
              ) {
                e.preventDefault();
                this.focusSearch();
                return;
              }

              if (e.key === "Escape") {
                if (this.search.hoveredIndex !== null) {
                  e.preventDefault();
                  this.search.hoveredIndex = null;
                  return;
                }
                if (isInputFocused) {
                  this.$refs.searchInput.blur();
                  return;
                }
                if (!this.isDesktop && this.view === "search") {
                  this.switchView("config");
                  return;
                }
                return;
              }

              if (isCmdOrCtrl && key === "s") {
                e.preventDefault();
                this.saveConfig();
                return;
              }

              const count = this.search.results.length;
              if (count > 0) {
                const cols = this.isDesktop ? 2 : 1;
                const curr = this.search.hoveredIndex;

                if (e.key === "Enter" && curr !== null && !isInputFocused) {
                  e.preventDefault();
                  this.selectSearchResult(this.search.results[curr]);
                  return;
                }

                if (e.key === "ArrowUp") {
                  e.preventDefault();
                  if (curr === null || curr < cols) {
                    this.search.hoveredIndex = null;
                    this.focusSearch();
                  } else {
                    this.search.hoveredIndex = curr - cols;
                  }
                  return;
                }

                if (["ArrowDown", "ArrowRight", "ArrowLeft"].includes(e.key)) {
                  if (isInputFocused) this.$refs.searchInput.blur();

                  if (e.key === "ArrowDown") {
                    e.preventDefault();
                    if (curr === null) {
                      this.search.hoveredIndex = 0;
                    } else if (curr + cols < count) {
                      this.search.hoveredIndex = curr + cols;
                    }
                    return;
                  }
                  if (e.key === "ArrowRight" && this.isDesktop) {
                    e.preventDefault();
                    this.search.hoveredIndex =
                      curr === null ? 0 : Math.min(curr + 1, count - 1);
                    return;
                  }
                  if (e.key === "ArrowLeft" && this.isDesktop) {
                    e.preventDefault();
                    this.search.hoveredIndex =
                      curr === null ? 0 : Math.max(curr - 1, 0);
                    return;
                  }
                }
              }

              if (isCmdOrCtrl && !isEditingInput) {
                if (key === "z") {
                  e.preventDefault();
                  e.shiftKey ? this.redoConfig() : this.undoConfig();
                } else if (key === "y") {
                  e.preventDefault();
                  this.redoConfig();
                }
              }
            });
          },
        };
      }
    </script>
  </body>
</html>
